# Deploy settings, in the repo rather than only in the Netlify UI — so a rebuilt
# site or a second environment cannot quietly differ from this one.

[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "22"

[functions]
  node_bundler = "esbuild"

# The enquiry function declares its own route (`export const config = { path }`),
# so there is no redirect here to keep in sync with it.

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"

# Fingerprinted build output: safe to cache forever, and it is the difference
# between a repeat visit costing one HTML request and costing all of them.
[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Not fingerprinted, but generated and stable — the tools rewrite the file in
# place, so a week is short enough to pick up a re-run and long enough to matter.
[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/clients/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/art/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"
